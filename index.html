<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Quieres ser mi San Valentín?</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c9184a;
      --secondary: #fff0f3;
      --dark: #2b2b2b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #fff0f3, #ffe5ec);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dark);
      overflow: hidden;
      padding: 16px;
    }

    .card {
      background: white;
      max-width: 520px;
      width: 100%;
      padding: 40px 28px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -80px;
      right: -80px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #ffb3c1, transparent 70%);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 16px;
      color: var(--primary);
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .heart {
      font-size: 3rem;
      margin-bottom: 20px;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .buttons {
      display: flex;
      gap: 14px;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      position: relative;
    }

    button {
      padding: 14px 24px;
      border-radius: 999px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 220px;
    }

    .yes {
      background: var(--primary);
      color: white;
      box-shadow: 0 10px 20px rgba(201,24,74,0.35);
    }

    .yes:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 14px 28px rgba(201,24,74,0.45);
    }

    .no {
      background: #f1f1f1;
      color: #666;
    }

    .message {
      margin-top: 32px;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--primary);
      display: none;
    }

    .floating-heart {
      position: absolute;
      font-size: 1.5rem;
      animation: floatUp 4s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-120vh); opacity: 0; }
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_4b7f3d1b6a.mp3" type="audio/mpeg">
  </audio>
  <div class="card">
    <div class="heart">❤️</div>
    <h1 id="title">Hola, mi amor 💕</h1>
    <p id="story">
      Antes de preguntarte algo importante…
      quiero que leas esto con calma.
    </p>

    <div class="buttons">
      <button class="yes" onclick="accept()">Sí, obvio 💖</button>
      <button class="no" onclick="decline()">Lo pensaré 🙈</button>
    </div>

    <div class="message" id="message"></div>

    <footer>
      Hecho con amor, especialmente para ti.
    </footer>
  </div>

  <script>
    const noBtn = document.querySelector('.no');
    const yesBtn = document.querySelector('.yes');
    const msg = document.getElementById('message');
    const title = document.getElementById('title');
    const story = document.getElementById('story');
    const music = document.getElementById('music');

    let step = 0;

    const steps = [
      {
        title: 'Hola, mi amor 💕',
        text: 'Desde que llegaste a mi vida, todo tiene más sentido.'
      },
      {
        title: 'Quiero decirte algo…',
        text: 'Me encanta compartir contigo, reír contigo y construir recuerdos juntos.'
      },
      {
        title: 'Y ahora sí…',
        text: 'Hay una pregunta muy importante que quiero hacerte.'
      },
      {
        title: '¿Quieres ser mi San Valentín? ❤️',
        text: 'Prometo risas, abrazos y un día inolvidable a tu lado.'
      }
    ];

    document.body.addEventListener('click', () => {
      if (music.paused) music.play();
      if (step < steps.length - 1) {
        step++;
        title.textContent = steps[step].title;
        story.textContent = steps[step].text;
      }
    }, { once: false });

    noBtn.addEventListener('mouseenter', () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 120 - 60;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    yesBtn.addEventListener('click', accept);

    function accept() {
      msg.style.display = 'block';
      msg.textContent = 'Sabía que dirías que sí. Te amo ❤️';
      launchHearts();
    }

    function launchHearts() {
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.textContent = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.bottom = '-20px';
        heart.style.animationDuration = 3 + Math.random() * 2 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }
    }
  </script>
</body>
</html>
